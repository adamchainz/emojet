[package]
name = "emojet"
version = "0.0.0"
edition = "2021"
readme = "README.rst"

[dependencies]
phf = { version = "0.13", features = ["macros"] }
pyo3 = { version = "0.29.0" }
unicode-normalization = "0.1.24"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lib]
name = "emojet_scan"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
